# Release helper. Two ways to publish a version:
#   1. Push a branch named  release/<version>  (e.g. release/v2.7.0) - the release is
#      created automatically from the latest successful build run.
#   2. Dispatch manually with a tag (and optionally a specific build run-id).
# It downloads the "Build Output" artifact (the combined multi-platform .geode) and
# uploads it to the release as cyber39dreamgd.gdmenu.geode.
name: Create release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must match the mod.json version)"
        required: true
        default: "v2.6.0"
      run_id:
        description: "Build run id whose 'Build Output' artifact to use (blank = latest successful build)"
        required: false
        default: ""
  push:
    branches:
      - "release/**"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    # Only for explicit releases: manual dispatch, or a push to a release/<version> branch
    if: github.event == 'workflow_dispatch' || startsWith(github.ref_name, 'release/')
    steps:
      - name: Resolve tag and build run
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          DISPATCH_RUN: ${{ inputs.run_id }}
          BRANCH: ${{ github.ref_name }}
        run: |
          latest_build() {
            gh run list --repo "$REPO" --workflow "Build Geode Mod" --status success \
              --limit 1 --json databaseId --jq '.[0].databaseId'
          }
          if [ "$EVENT" = "workflow_dispatch" ]; then
            TAG="$DISPATCH_TAG"
            RUN_ID="$DISPATCH_RUN"
          else
            TAG="${BRANCH#release/}"
            RUN_ID=""
          fi
          if [ -z "$RUN_ID" ]; then RUN_ID=$(latest_build); fi
          if [ -z "$TAG" ] || [ -z "$RUN_ID" ]; then echo "Could not resolve tag/run"; exit 1; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Publishing $TAG from build run $RUN_ID"

      - name: Download Build Output from the build run
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          artid=$(gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name=="Build Output") | .id')
          if [ -z "$artid" ]; then echo "No 'Build Output' artifact on run $RUN_ID"; exit 1; fi
          gh api "repos/$REPO/actions/runs/$RUN_ID/artifacts/$artid/zip" \
            -H "Accept: application/octet-stream" > build-output.zip
          unzip -o build-output.zip
          ls -laR

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          geode_file=$(find . -maxdepth 3 -name "*.geode" | head -1)
          if [ -z "$geode_file" ]; then echo "No .geode file found in the artifact"; exit 1; fi
          mv "$geode_file" cyber39dreamgd.gdmenu.geode
          echo "Publishing: cyber39dreamgd.gdmenu.geode ($(stat -c%s cyber39dreamgd.gdmenu.geode) bytes)"
          ver=$(unzip -p cyber39dreamgd.gdmenu.geode mod.json | grep -o '"version"[^,]*' || true)
          echo "mod.json says: $ver"
          case "$ver" in *"$TAG"*) ;; *) echo "Version mismatch: expected $TAG in mod.json"; exit 1;; esac
          notes=$(cat <<'NOTES'
## v2.6.0
- **In-game Status** (Tools tab): small top-right indicator while playing showing which hacks are on (NC / SPD / AC / STEP) plus the bot state (REC / PLAY / FFWD) and SAFE. Modes: auto / always / off
- **Auto-Save Bot** (Bot tab, on by default): complete a level while recording and the bot is saved straight away as `<level name>.gdbot`
- **`.gdbot` is the only format** (GDR2 binary layout)
- **Bots tab**: Play button on every row, level stars for local levels, and a saved sessions list
- Frame counter shows time: `Frame 5532 (0:23)`
NOTES
)
          gh release create "$TAG" cyber39dreamgd.gdmenu.geode --title "$TAG" --notes "$notes"
